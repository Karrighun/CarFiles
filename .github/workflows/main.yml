name: Android build
on: [push, workflow_dispatch]
permissions:
  contents: write
defaults:
  run:
    working-directory: CarFiles
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Лицензии Android SDK
        working-directory: .
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: CarFiles
      - run: chmod +x gradlew
      - name: Обычная сборка
        run: ./gradlew testDebugUnitTest assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk ../CarFiles-0.4.0-normal.apk
      - name: Lab-сборка
        run: ./gradlew -PprojectionLab=true assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk ../CarFiles-0.4.0-lab.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CarFiles-APK
          path: CarFiles-0.4.0-*.apk
      - name: Публикация в Releases
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.4.0 --yes --cleanup-tag || true
          gh release create v0.4.0 CarFiles-0.4.0-normal.apk CarFiles-0.4.0-lab.apk --title "CarFiles 0.4.0" --notes "Debug APK: normal (только аудио) и lab (экран на Android Auto)"
